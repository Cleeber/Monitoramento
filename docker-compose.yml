version: '3.8'

# Aplicação unificada: Express serve a API + a SPA estática numa única porta.
# Subdomínio api.pagina1digital.com.br deixa de existir (mesma origem).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uptime-monitor
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_SECURE=${SMTP_SECURE}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://monitor.pagina1digital.com.br}
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploads:
  reports:
